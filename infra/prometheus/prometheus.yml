global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: flink
    static_configs:
      - targets: ["jobmanager:9249", "taskmanager:9249"]
  - job_name: serving
    static_configs:
      - targets: ["serving:8000"]
  - job_name: embedding
    static_configs:
      - targets: ["embedding:8000"]
