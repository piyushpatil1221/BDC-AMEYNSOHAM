# Real-time session-based news recommender: local, low-memory stack.
# Every container has an explicit mem_limit. Core budget (~4.4 GB) is listed in the README.
# Profiles: core (the pipeline), monitoring (Prometheus + Grafana), tools (one-shot jobs), submit (Flink job).

x-flink-common: &flink-common
  build:
    context: .
    dockerfile: flink-jobs/Dockerfile
  image: bdc/flink:1.20.5-py311
  profiles: ["core"]
  volumes:
    - flink-checkpoints:/opt/flink/checkpoints
    - ./config:/config:ro
    - ./flink-jobs/newsrec:/opt/flink/usrlib/newsrec:ro   # live job code (picked up on each submission)
    - ./newsrec_core:/opt/flink/usrlib/newsrec_core:ro
  # No inline comments inside FLINK_PROPERTIES: Flink 1.20's YAML config parser rejects them. Notes:
  #  - unaligned checkpoints let barriers overtake backpressured buffers, so checkpoints still complete
  #  - python.*cache-size: larger Python-side keyed-state caches = fewer round trips to the JVM
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      jobmanager.memory.process.size: 640m
      jobmanager.memory.off-heap.size: 32m
      jobmanager.memory.jvm-metaspace.size: 192m
      jobmanager.memory.jvm-overhead.min: 128m
      taskmanager.memory.process.size: 1400m
      taskmanager.numberOfTaskSlots: 2
      parallelism.default: 1
      state.backend.type: rocksdb
      state.backend.incremental: true
      state.backend.rocksdb.memory.managed: true
      state.backend.rocksdb.metrics.estimate-live-data-size: true
      state.backend.rocksdb.metrics.total-sst-files-size: true
      state.backend.rocksdb.metrics.estimate-num-keys: true
      state.checkpoints.dir: file:///opt/flink/checkpoints
      state.checkpoints.num-retained: 1
      execution.checkpointing.interval: 30s
      execution.checkpointing.unaligned.enabled: true
      python.state.cache-size: 20000
      python.map-state.read-cache-size: 20000
      python.map-state.write-cache-size: 20000
      python.executable: /opt/venv/bin/python
      python.client.executable: /opt/venv/bin/python
      metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
      metrics.reporter.prom.port: 9249

x-python-tool: &python-tool
  profiles: ["tools"]
  volumes:
    - ./config:/config:ro
    - ./data:/data
    - ./replay:/app/replay:ro   # live source, so script edits don't need an image rebuild

services:
  # --- Messaging -------------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    profiles: ["core"]
    mem_limit: 512m
    ports: ["29092:29092"]  # host access (localhost:29092); containers use kafka:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_ROLL_MS: 600000          # roll segments every 10 min so retention can actually delete
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-streams:
    build: ./kafka-streams
    image: bdc/kafka-streams:latest
    profiles: ["core"]
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DEDUP_WINDOW_MIN: 10

  # --- Storage ---------------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    profiles: ["core"]
    mem_limit: 300m
    ports: ["6333:6333"]
    volumes:
      - qdrant-data:/qdrant/storage

  scylla:
    image: scylladb/scylla:6.2.3
    restart: unless-stopped
    profiles: ["core"]
    mem_limit: 700m
    # Seastar keeps a reserve outside --memory; 600M did not fit a 700 MB cgroup (needs ~550 MiB, sees ~477).
    command: --smp 1 --memory 500M --overprovisioned 1 --developer-mode 1
    ports: ["9042:9042"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    volumes:
      - scylla-data:/var/lib/scylla

  # --- Models & serving ------------------------------------------------------------------------
  embedding:
    build: ./embedding-service
    image: bdc/embedding:latest
    restart: unless-stopped
    profiles: ["core"]
    mem_limit: 450m
    ports: ["8001:8000"]
    volumes:
      - ./config:/config:ro

  serving:
    build:
      context: .
      dockerfile: serving-api/Dockerfile
    image: bdc/serving:latest
    profiles: ["core"]
    mem_limit: 200m
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }
    volumes:
      - ./config:/config:ro

  # --- Stream processing -----------------------------------------------------------------------
  jobmanager:
    <<: *flink-common
    command: jobmanager
    restart: unless-stopped
    ports: ["8081:8081"]
    mem_limit: 640m

  taskmanager:
    <<: *flink-common
    command: taskmanager
    restart: unless-stopped
    depends_on: [jobmanager]
    mem_limit: 1400m

  # One-shot job submitter. `flink run -py` starts a JVM client plus a Python process;
  # running it here keeps that transient memory out of the JobManager's 640 MB.
  flink-submit:
    <<: *flink-common
    profiles: ["submit"]
    depends_on: [jobmanager]
    mem_limit: 700m
    entrypoint: ["flink", "run", "-d", "-m", "jobmanager:8081", "-py", "/opt/flink/usrlib/newsrec/job.py"]
    command: []

  init:
    build: ./infra/init
    image: bdc/init:latest
    profiles: ["core"]
    mem_limit: 200m
    restart: "no"
    depends_on:
      scylla: { condition: service_healthy }
    volumes:
      - ./config:/config:ro
      - ./infra/scylla:/schema:ro

  # --- Monitoring (optional) -------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    profiles: ["monitoring"]
    mem_limit: 200m
    ports: ["9090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=6h"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    profiles: ["monitoring"]
    mem_limit: 200m
    ports: ["3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # --- One-shot tools --------------------------------------------------------------------------
  replay:
    <<: *python-tool
    build: ./replay
    image: bdc/replay:latest
    mem_limit: 400m
    command: ["replay.producer"]

  eval:
    build: ./eval
    image: bdc/eval:latest
    profiles: ["tools"]
    mem_limit: 1g    # offline only, never runs alongside the full stack's peak
    volumes:
      - .:/w
      - ./data:/data
      - ./config:/config:ro

  tests:
    build: ./tests
    image: bdc/tests:latest
    profiles: ["tools"]
    mem_limit: 300m
    volumes:
      - .:/w

volumes:
  flink-checkpoints:
  kafka-data:
  qdrant-data:
  scylla-data:
