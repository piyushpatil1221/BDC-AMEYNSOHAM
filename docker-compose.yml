# Real-time session-based news recommender: local, low-memory stack.
# Every container has an explicit mem_limit (core budget target ~4.4 GB; see README).
# Profiles: core (always), tools (one-shot jobs: init, data, replay), submit (Flink job submission).

x-flink-common: &flink-common
  build: ./flink-jobs
  image: bdc/flink:1.20.5-py311
  profiles: ["core"]
  volumes:
    - flink-checkpoints:/opt/flink/checkpoints
    - ./config:/config:ro
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      jobmanager.memory.process.size: 640m
      jobmanager.memory.off-heap.size: 32m
      jobmanager.memory.jvm-metaspace.size: 192m
      jobmanager.memory.jvm-overhead.min: 128m
      taskmanager.memory.process.size: 1400m
      taskmanager.numberOfTaskSlots: 2
      parallelism.default: 1
      state.backend.type: rocksdb
      state.backend.incremental: true
      state.backend.rocksdb.memory.managed: true
      state.checkpoints.dir: file:///opt/flink/checkpoints
      execution.checkpointing.interval: 30s
      python.executable: /opt/venv/bin/python
      python.client.executable: /opt/venv/bin/python

x-python-tool: &python-tool
  profiles: ["tools"]
  volumes:
    - ./config:/config:ro
    - ./data:/data

services:
  # --- Messaging -------------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.1
    profiles: ["core"]
    mem_limit: 512m
    ports: ["29092:29092"]  # host access (localhost:29092); containers use kafka:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_ROLL_MS: 600000          # roll segments every 10 min so retention can actually delete
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    volumes:
      - kafka-data:/var/lib/kafka/data

  # --- Storage ---------------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.5
    profiles: ["core"]
    mem_limit: 300m
    ports: ["6333:6333"]
    volumes:
      - qdrant-data:/qdrant/storage

  scylla:
    image: scylladb/scylla:6.2.3
    profiles: ["core"]
    mem_limit: 700m
    # Seastar keeps a reserve outside --memory; 600M did not fit a 700 MB cgroup (needs ~550 MiB, sees ~477).
    command: --smp 1 --memory 500M --overprovisioned 1 --developer-mode 1
    ports: ["9042:9042"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    volumes:
      - scylla-data:/var/lib/scylla

  # --- Stream processing -----------------------------------------------------------------------
  jobmanager:
    <<: *flink-common
    command: jobmanager
    ports: ["8081:8081"]
    mem_limit: 640m

  taskmanager:
    <<: *flink-common
    command: taskmanager
    depends_on: [jobmanager]
    mem_limit: 1400m

  # One-shot job submitter. `flink run -py` starts a JVM client plus a Python process;
  # running it here keeps that transient memory out of the JobManager's 640 MB.
  flink-submit:
    <<: *flink-common
    profiles: ["submit"]
    depends_on: [jobmanager]
    mem_limit: 700m
    entrypoint: ["flink", "run", "-d", "-m", "jobmanager:8081"]
    command: ["-py", "/opt/flink/usrlib/spike/memory_probe.py"]

  # --- One-shot tools --------------------------------------------------------------------------
  init:
    build: ./infra/init
    image: bdc/init:latest
    profiles: ["core"]
    mem_limit: 200m
    restart: "no"
    depends_on:
      scylla: { condition: service_healthy }
    volumes:
      - ./config:/config:ro
      - ./infra/scylla:/schema:ro

  replay:
    <<: *python-tool
    build: ./replay
    image: bdc/replay:latest
    mem_limit: 400m
    command: ["replay.producer"]

volumes:
  flink-checkpoints:
  kafka-data:
  qdrant-data:
  scylla-data:
